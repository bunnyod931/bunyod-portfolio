<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin | Bunyod Samandarov</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="index.html"><span class="brand-mark">BS</span><span>Bunyod Academic</span></a>
      <nav id="adminNav" class="admin-nav" hidden></nav>
      <div class="admin-sidebar-footer">
        <a href="index.html" target="_blank" rel="noopener">View website ↗</a>
        <button id="signOutButton" class="admin-link-button" type="button" hidden>Sign out</button>
      </div>
    </aside>

    <main class="admin-main">
      <section id="loginView" class="admin-login-wrap">
        <div class="admin-login-card">
          <p class="eyebrow">Private content manager</p>
          <h1>Website Admin</h1>
          <p class="admin-muted">Sign in with the administrator email and password you created in Supabase.</p>
          <form id="loginForm" class="admin-form login-form">
            <label>Email<input id="loginEmail" type="email" autocomplete="username" required /></label>
            <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
            <button class="button button-primary" type="submit">Sign in</button>
          </form>
          <p id="loginMessage" class="admin-message" role="status"></p>
          <a class="admin-back" href="index.html">← Return to website</a>
        </div>
      </section>

      <section id="dashboardView" hidden>
        <header class="admin-topbar">
          <div><p class="eyebrow">Content manager</p><h1 id="sectionTitle">Profile</h1></div>
          <div class="admin-top-actions">
            <button id="seedButton" class="button button-ghost" type="button">Initialize Version 2.5 content</button>
            <button id="newItemButton" class="button button-primary" type="button">Add item</button>
          </div>
        </header>

        <div id="statusBar" class="admin-status" hidden></div>

        <section id="editorPanel" class="admin-panel">
          <form id="contentForm" class="admin-form"></form>
        </section>

        <section class="admin-panel list-panel">
          <div class="panel-heading"><h2>Saved items</h2><span id="itemCount">0 items</span></div>
          <div id="itemList" class="admin-item-list"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
